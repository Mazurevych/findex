name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ruff · pyright · pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install (exactly as in uv.lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types (pyright strict)
        run: uv run pyright
      - name: Tests + coverage
        run: uv run pytest --cov --cov-report=term

  build:
    name: wheel
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Install the wheel as a tool and run it
        run: |
          uv tool install dist/*.whl
          findex --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
