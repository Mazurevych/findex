name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ruff · pyright · pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install (exactly as in uv.lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types (pyright strict)
        run: uv run pyright
      - name: Tests + coverage
        run: uv run pytest --cov --cov-report=term

  build:
    name: wheel
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Install the wheel as a tool and run it
        run: |
          uv tool install dist/*.whl
          findex --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: docker image + /health
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (corpus + index inside the image)
        run: docker build -t findex .
      - name: Run and probe
        run: |
          docker run -d --name findex -p 8000:8000 findex
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          echo
          curl -fsS "http://127.0.0.1:8000/search?q=%22pattern+matching%22&k=3" | head -c 600
          echo
          curl -fsS http://127.0.0.1:8000/stats
          echo
          curl -fsS http://127.0.0.1:8000/ | grep -q "findex"
          test "$(docker inspect -f '{{.Config.User}}' findex)" = "findex"   # не root
          docker logs findex | tail -20
