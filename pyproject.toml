[project]
name = "findex"
version = "0.6.0"
description = "Навчальна пошукова система: індекс, BM25, мова запитів, паралельна індексація, краулер"
readme = "README.md"
authors = [{ name = "Yakiv Mazurevych" }]
requires-python = ">=3.12"
keywords = ["search", "inverted-index", "bm25", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.8",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/Mazurevych/findex"
Course = "https://github.com/rmalkevy/Programming-Practice-Projects/tree/main/courses/python"

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pyright>=1.1.400",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:", "raise AssertionError", "\\.\\.\\.$"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["slow: довгі тести (> 1 с); пропустити: -m 'not slow'"]
