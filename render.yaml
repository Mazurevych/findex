# Render Blueprint: New → Blueprint → репозиторій Mazurevych/findex → Apply.
# Render сам збирає Dockerfile, ставить змінну PORT і шле трафік лише після 200 на /health.
services:
  - type: web
    name: findex
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:  # перебудовувати лише коли змінився код, а не README чи результати замірів
      paths:
        - src/**
        - Dockerfile
        - pyproject.toml
        - uv.lock
        - scripts/get_corpus.py
    envVars:
      - key: INDEX_PATH
        value: /app/index.bin
      - key: INDEX_MMAP
        value: "true"
      - key: SEARCH_HANDLER
        value: sync
      - key: LOG_LEVEL
        value: info
